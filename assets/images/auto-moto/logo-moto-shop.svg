<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="Bizdavar Moto">
  <title>Bizdavar Moto</title>
  <desc>Bizdavar wordmark with a sport motorcycle mark at the start</desc>
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171513"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="mstreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c518" stop-opacity="0"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="mtank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b41"/>
      <stop offset="1" stop-color="#c41018"/>
    </linearGradient>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .m-streak { animation: m-whoosh 1.2s linear infinite; }
        .m-wheel { transform-box: fill-box; transform-origin: center; animation: m-spin 1.6s linear infinite; }
      }
      @keyframes m-whoosh {
        from { transform: translateX(-14px); opacity: .22; }
        to { transform: translateX(36px); opacity: 0; }
      }
      @keyframes m-spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <rect width="880" height="300" rx="28" fill="url(#mbg)"/>

  <g fill="url(#mstreak)">
    <rect class="m-streak" x="28" y="70" width="100" height="3" rx="2"/>
    <rect class="m-streak" x="20" y="88" width="68" height="2" rx="1" style="animation-delay:.2s"/>
    <rect class="m-streak" x="36" y="230" width="118" height="3" rx="2" style="animation-delay:.45s"/>
  </g>

  <!-- Sportbike mark -->
  <g transform="translate(40 78)">
    <g transform="translate(46 118)">
      <g class="m-wheel">
        <circle r="34" fill="#111" stroke="#e3191f" stroke-width="8"/>
        <circle r="10" fill="#111" stroke="#f5c518" stroke-width="3"/>
        <path d="M0-20 V-11M0 11 V20M-20 0 H-11M11 0 H20" stroke="#f5c518" stroke-width="2"/>
      </g>
    </g>
    <g transform="translate(198 118)">
      <g class="m-wheel">
        <circle r="34" fill="#111" stroke="#e3191f" stroke-width="8"/>
        <circle r="10" fill="#111" stroke="#f5c518" stroke-width="3"/>
        <path d="M0-20 V-11M0 11 V20M-20 0 H-11M11 0 H20" stroke="#f5c518" stroke-width="2"/>
      </g>
    </g>
    <path d="M46 118 L128 104" stroke="#6e6e6e" stroke-width="6" stroke-linecap="round"/>
    <path d="M176 58 L198 118" stroke="#ddd" stroke-width="7" stroke-linecap="round"/>
    <path d="M70 96 C86 52 132 44 168 58 L188 78 C176 96 148 110 118 112 C96 114 80 108 70 96Z" fill="url(#mtank)"/>
    <path d="M70 96 L42 84 L46 118 L78 108Z" fill="#f3f3f3"/>
    <path d="M160 52 L176 34 L188 46 L172 62Z" fill="#f3f3f3"/>
    <ellipse cx="190" cy="70" rx="10" ry="6" fill="#f5c518"/>
    <path d="M170 48 L190 30" stroke="#f3f3f3" stroke-width="5" stroke-linecap="round"/>
    <path d="M188 30 H206" stroke="#e3191f" stroke-width="4" stroke-linecap="round"/>
    <path d="M96 112 H156" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(292 190) skewX(-6)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-0.045em">
    <text>
      <tspan fill="#f4f4f4">Bizda</tspan><tspan fill="#e3191f">var</tspan>
    </text>
  </g>
</svg>
